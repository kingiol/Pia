openapi: 3.1.0
info:
  title: Pia Local Agent API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/settings/deepseek:
    get:
      description: Local-only credential status. Requires a loopback peer and host, and a trusted Desktop origin when Origin is present. Never returns the secret.
      responses:
        "200":
          description: Effective credential source
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeepSeekCredentialStatus"}
        "401": {description: Authentication required when configured}
        "403": {description: Not a trusted local credential request}
    post:
      description: Save to the system credential store and update subsequent model requests without restarting. A saved Key takes precedence over DEEPSEEK_API_KEY.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api_key]
              properties:
                api_key: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      responses:
        "200":
          description: Credential saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeepSeekCredentialStatus"}
        "400": {description: Invalid credential request}
        "401": {description: Authentication required when configured}
        "403": {description: Not a trusted local credential request}
    delete:
      description: Clear the saved Key and immediately fall back to DEEPSEEK_API_KEY, if configured.
      responses:
        "200":
          description: Saved credential cleared
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeepSeekCredentialStatus"}
        "401": {description: Authentication required when configured}
        "403": {description: Not a trusted local credential request}
  /api/settings/tushare:
    get:
      description: Local-only effective Tushare credential status. Never returns the token.
      responses:
        "200":
          description: Effective credential source
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LocalCredentialStatus"}
        "401": {description: Authentication required when configured}
        "403": {description: Not a trusted local credential request}
    post:
      description: Save the token in the system credential store and enable the free A-share stock daily route without restarting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
      responses:
        "200":
          description: Token saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LocalCredentialStatus"}
        "400": {description: Invalid credential request}
        "401": {description: Authentication required when configured}
        "403": {description: Not a trusted local credential request}
    delete:
      description: Clear the saved token and immediately fall back to TUSHARE_TOKEN, if configured.
      responses:
        "200":
          description: Saved token cleared
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LocalCredentialStatus"}
        "401": {description: Authentication required when configured}
        "403": {description: Not a trusted local credential request}
  /api/tasks/{task_id}/flow:
    get:
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: after_seq, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: snapshot_seq, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Recorded execution flow with stable node upserts
          content:
            application/json:
              schema:
                $ref: "./schemas/run-flow.json"
        "404": {description: Task not visible to the current user}
  /api/tasks/{task_id}/export:
    get:
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Audited sanitized frozen context, decision and persisted result metadata
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, context, decision, result_metadata]
                properties:
                  schema_version: {const: "1"}
                  context: {$ref: "#/components/schemas/TaskContextResponse"}
                  decision: {type: [object, "null"]}
                  result_metadata: {$ref: "./schemas/result-metadata.json"}
        "404": {description: Task not visible to the current user}
  /api/screening-strategies:
    get:
      responses:
        "200":
          description: Registered immutable strategy versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items: {$ref: "./schemas/screening-strategy.json"}
  /api/candidate-scans:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [as_of]
              properties:
                as_of: {type: string, format: date}
                strategy_id: {type: string, default: legacy_momentum_v1}
                strategy_version: {type: string, default: 1.0.0}
                fixture: {type: string}
      responses:
        "201":
          description: Frozen scan and factor explanations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CandidateListResponse"}
        "400": {description: Invalid scan parameters}
        "404": {description: Unknown strategy or version}
  /api/candidate-scans/{scan_id}:
    get:
      parameters:
        - {name: scan_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Frozen scan owned by the current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CandidateListResponse"}
        "404": {description: Scan not visible to the current user}
  /api/candidate-scans/{scan_id}/replay:
    post:
      parameters:
        - {name: scan_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Offline replay from frozen scan inputs and the original strategy version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CandidateListResponse"}
        "409": {description: Strategy or input hash mismatch}
        "404": {description: Scan or strategy version not found}
  /api/health:
    get:
      responses:
        "200":
          description: Runtime health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/providers:
    get:
      responses:
        "200":
          description: Provider health and circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthResponse"
  /api/metrics:
    get:
      responses:
        "200":
          description: Task latency and terminal success metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /api/rules:
    get:
      responses:
        "200":
          description: Active rules and immutable snapshot identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: New immutable ruleset version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"
  /api/profile:
    get:
      responses:
        "200":
          description: Current investor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfile"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "./schemas/profile.json"
      responses:
        "201":
          description: New profile version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfile"
  /api/watchlists:
    get:
      responses:
        "200":
          description: User-scoped watchlists
          content:
            application/json:
              schema:
                type: object
                required: [watchlists]
                properties:
                  watchlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/Watchlist"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Saved watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"
  /api/memory:
    get:
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: symbol
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: User-scoped semantic memory search
          content:
            application/json:
              schema:
                type: object
                required: [memories]
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/SemanticMemory"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticMemoryInput"
      responses:
        "201":
          description: Saved semantic memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticMemory"
  /api/journal:
    get:
      parameters:
        - name: symbol
          in: query
          schema: {type: string}
        - name: intent
          in: query
          schema: {type: string}
        - name: outcome_status
          in: query
          schema: {type: string}
        - name: rule_snapshot_id
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: User-scoped cross-task decision journal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalListResponse"
  /api/journal/summary:
    get:
      parameters:
        - name: symbol
          in: query
          schema: {type: string}
        - name: intent
          in: query
          schema: {type: string}
        - name: outcome_status
          in: query
          schema: {type: string}
        - name: rule_snapshot_id
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Deterministic cross-task journal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalSummaryResponse"
  /api/journal/patterns:
    get:
      parameters:
        - name: symbol
          in: query
          schema: {type: string}
        - name: intent
          in: query
          schema: {type: string}
        - name: outcome_status
          in: query
          schema: {type: string}
        - name: rule_snapshot_id
          in: query
          schema: {type: string}
        - name: from
          in: query
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Deterministic cross-task journal patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalPatternsResponse"
  /api/journal/memory-candidates:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCandidateMaterializeRequest"
      responses:
        "201":
          description: Saved user-scoped derived memory candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidate"
  /api/journal/memory-candidates/{candidate_id}/review:
    post:
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCandidateReviewRequest"
      responses:
        "200":
          description: Reviewed user-scoped memory candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidate"
  /api/journal/memory-candidates/{candidate_id}/usage:
    get:
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: User-scoped memory candidate usage and task references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidateUsageResponse"
  /api/journal/memory-candidates/{candidate_id}/feedback:
    post:
      parameters:
        - name: candidate_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCandidateFeedbackRequest"
      responses:
        "200":
          description: Recorded user feedback for the latest or selected memory usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidateFeedbackResponse"
  /api/portfolio:
    get:
      responses:
        "200":
          description: Latest portfolio snapshot for the authenticated user
          content:
            application/json:
              schema:
                $ref: "./schemas/portfolio.json"
  /api/market:
    get:
      responses:
        "200":
          description: Latest market snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/audit:
    get:
      responses:
        "200":
          description: Append-only audit records for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResponse"
  /api/scheduler:
    get:
      responses:
        "200":
          description: Local scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerResponse"
  /api/scheduler/start:
    post:
      responses:
        "200":
          description: Scheduler started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerResponse"
  /api/scheduler/stop:
    post:
      responses:
        "200":
          description: Scheduler stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerResponse"
  /api/data/sync:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [as_of]
              properties:
                as_of: {type: string, format: date}
                symbols:
                  type: array
                  items: {type: string}
      responses:
        "202":
          description: Market data synchronization accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSyncResponse"
  /api/orders/preview:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "200":
          description: Paper-order preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPreviewResponse"
  /api/orders/paper:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Paper-only order receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperOrderResponse"
  /api/tasks:
    get:
      responses:
        "200":
          description: Research tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/tasks/{task_id}:
    get:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
  /api/tasks/{task_id}/context:
    get:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
        - name: view
          in: query
          schema: {type: string, enum: [overview, full], default: overview}
      responses:
        "200":
          description: Frozen task context; overview by default, full requires task ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskContextResponse"
  /api/tasks/{task_id}/data:
    get:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Persisted analytical snapshots and raw provider payloads used by the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDataResponse"
        "404":
          description: Task not found for the authenticated user
  /api/tasks/{task_id}/retrospectives:
    get:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Historical actions and outcomes recorded for a task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrospectiveListResponse"
        "404":
          description: Task not found for the authenticated user
    post:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrospectiveRequest"
      responses:
        "201":
          description: Retrospective record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retrospective"
  /api/tasks/{task_id}/events:
    get:
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/tasks/{task_id}/lease:
    get:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acquired task lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
  /api/leases/{lease_id}/heartbeat:
    post:
      security:
        - bearerAuth: []
      parameters:
        - name: lease_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
  /api/leases/{lease_id}/release:
    post:
      security:
        - bearerAuth: []
      parameters:
        - name: lease_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Lease released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/tasks/{task_id}/approve:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
  /api/tasks/{task_id}/retry:
    post:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/tasks/{task_id}/replay:
    post:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "202":
          description: Replay task created with the original task as parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/tasks/{task_id}/cancel:
    post:
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/tasks/{task_id}/takeover:
    post:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: {type: string}
      responses:
        "200":
          description: Manual takeover recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskContextResponse"
  /api/tasks/{task_id}/pause:
    post:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Task paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/tasks/{task_id}/resume:
    post:
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Task resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/events:
    get:
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "202":
          description: Event accepted or deduplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
  /api/portfolio/import:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioImportRequest"
      responses:
        "201":
          description: Portfolio snapshot imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
  /api/candidates:
    get:
      parameters:
        - name: as_of
          in: query
          required: false
          schema: {type: string, format: date}
        - name: fixture
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Replayable ranked candidate scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListResponse"
  /api/notifications:
    get:
      parameters:
        - name: unread
          in: query
          schema: {type: string, enum: ["0", "1"]}
      responses:
        "200":
          description: In-app notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
  /api/notifications/{notification_id}/read:
    post:
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/notifications/{notification_id}/deliveries:
    get:
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Notification delivery receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryListResponse"
        "404":
          description: Notification not found for the authenticated user
  /api/devices:
    get:
      responses:
        "200":
          description: Registered devices for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/device.json"
      responses:
        "201":
          description: Device registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
  /api/devices/{device_id}:
    delete:
      parameters:
        - name: device_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Device unregistered
          content:
            application/json:
              schema:
                type: object
                required: [status, device_id]
                properties:
                  status: {type: string, enum: [unregistered]}
                  device_id: {type: string}
  /api/sync:
    get:
      parameters:
        - name: cursor
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200":
          description: Incremental audit-backed sync changes
          content:
            application/json:
              schema:
                $ref: "./schemas/sync.json"
