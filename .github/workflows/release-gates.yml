name: release-gates

on:
  workflow_dispatch:
    inputs:
      acceptance_as_of:
        description: "Trading date used by the live acceptance"
        required: true
      freshness_dates:
        description: "Comma-separated confirmed trading dates for freshness"
        required: true

jobs:
  live-acceptance:
    environment: live-release
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PIA_POSTGRES_DSN: ${{ secrets.PIA_POSTGRES_DSN }}
      PIA_WEB_PUSH_GATEWAY_URL: ${{ secrets.PIA_WEB_PUSH_GATEWAY_URL }}
      PIA_WEB_PUSH_GATEWAY_TOKEN: ${{ secrets.PIA_WEB_PUSH_GATEWAY_TOKEN }}
      PIA_APNS_GATEWAY_URL: ${{ secrets.PIA_APNS_GATEWAY_URL }}
      PIA_APNS_GATEWAY_TOKEN: ${{ secrets.PIA_APNS_GATEWAY_TOKEN }}
      PIA_FCM_GATEWAY_URL: ${{ secrets.PIA_FCM_GATEWAY_URL }}
      PIA_FCM_GATEWAY_TOKEN: ${{ secrets.PIA_FCM_GATEWAY_TOKEN }}
      PIA_PUSH_ACCEPTANCE_WEB_TOKEN: ${{ secrets.PIA_PUSH_ACCEPTANCE_WEB_TOKEN }}
      PIA_PUSH_ACCEPTANCE_IOS_TOKEN: ${{ secrets.PIA_PUSH_ACCEPTANCE_IOS_TOKEN }}
      PIA_PUSH_ACCEPTANCE_ANDROID_TOKEN: ${{ secrets.PIA_PUSH_ACCEPTANCE_ANDROID_TOKEN }}
      PIA_ACCEPTANCE_MODE: release
      PIA_DESKTOP_UI_SMOKE: "0"
      PIA_ACCEPTANCE_AS_OF: ${{ inputs.acceptance_as_of }}
      PIA_FRESHNESS_DATES: ${{ inputs.freshness_dates }}
      PIA_DATA_PROVIDER: akshare
    steps:
      - uses: actions/checkout@v4

      - name: Check live credentials
        shell: bash
        run: |
          missing=()
          [[ -n "${DEEPSEEK_API_KEY:-}" ]] || missing+=("DEEPSEEK_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing release credentials: ${missing[*]}" >&2
            exit 1
          fi
          if [[ -n "${TUSHARE_TOKEN:-}" ]]; then
            echo "DeepSeek and Tushare credentials are configured; live acceptance will include fallback/provenance."
          else
            echo "DeepSeek is configured; Tushare fallback/provenance checks will be skipped."
          fi
          if [[ -n "${PIA_WEB_PUSH_GATEWAY_URL:-}" || -n "${PIA_APNS_GATEWAY_URL:-}" || -n "${PIA_FCM_GATEWAY_URL:-}" ]]; then
            echo "External push gateway configured; push delivery acceptance will run."
          else
            echo "No external push gateway configured; push delivery acceptance will be skipped."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS sidecar for Tauri verification
        run: ./scripts/build-sidecar.sh

      - name: Run live release acceptance
        id: acceptance
        shell: bash
        run: ./scripts/acceptance.sh | tee "$RUNNER_TEMP/pia-release-acceptance.log"

      - name: Summarize live release acceptance
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        shell: bash
        run: |
          {
            printf '## Live release acceptance\n\n'
            printf 'Acceptance step: **%s**\n\n' "${ACCEPTANCE_OUTCOME:-skipped}"
            if [[ -f "$RUNNER_TEMP/pia-release-acceptance.log" ]]; then
              grep -E '^[A-Z][A-Z0-9 ]+ SKIP( |$)' "$RUNNER_TEMP/pia-release-acceptance.log" | sed 's/^/- /' || true
            else
              printf 'The acceptance command did not run. See the preceding steps for the blocker.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pia-live-evidence
          path: |
            .pia/acceptance/
            .pia/release/
          if-no-files-found: warn

  windows-release:
    environment: live-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PIA_DATA_PROVIDER: fixture
      PIA_WINDOWS_ACCEPTANCE_PORT: 8890
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Install JavaScript dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2"

      - name: Build Windows sidecar and MSI
        shell: pwsh
        run: ./scripts/desktop-build.ps1

      - name: Verify Windows sidecar health
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem "apps/desktop/src-tauri/binaries" -Filter "pia-runtime-*.exe" | Select-Object -First 1
          if (-not $sidecar) { throw "Windows sidecar was not produced" }
          $health = (& $sidecar.FullName health --json | ConvertFrom-Json)
          if ($health.status -ne "ok") { throw "Unexpected sidecar status: $($health.status)" }

      - name: Run packaged Windows acceptance
        shell: pwsh
        run: ./scripts/windows-acceptance.ps1

      - name: Run Windows native notification smoke
        shell: pwsh
        run: ./scripts/native-notification-smoke.ps1

      - name: Create Windows release manifest
        shell: pwsh
        run: |
          python scripts/release_manifest.py `
            --root . `
            --output .pia/release/manifest.json `
            apps/desktop/src-tauri/target/release/bundle/msi `
            apps/desktop/src-tauri/binaries

      - name: Run release preflight
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PIA_POSTGRES_DSN: ${{ secrets.PIA_POSTGRES_DSN }}
          PIA_WEB_PUSH_GATEWAY_URL: ${{ secrets.PIA_WEB_PUSH_GATEWAY_URL }}
          PIA_WEB_PUSH_GATEWAY_TOKEN: ${{ secrets.PIA_WEB_PUSH_GATEWAY_TOKEN }}
          PIA_APNS_GATEWAY_URL: ${{ secrets.PIA_APNS_GATEWAY_URL }}
          PIA_APNS_GATEWAY_TOKEN: ${{ secrets.PIA_APNS_GATEWAY_TOKEN }}
          PIA_FCM_GATEWAY_URL: ${{ secrets.PIA_FCM_GATEWAY_URL }}
          PIA_FCM_GATEWAY_TOKEN: ${{ secrets.PIA_FCM_GATEWAY_TOKEN }}
          PIA_PUSH_ACCEPTANCE_WEB_TOKEN: ${{ secrets.PIA_PUSH_ACCEPTANCE_WEB_TOKEN }}
          PIA_PUSH_ACCEPTANCE_IOS_TOKEN: ${{ secrets.PIA_PUSH_ACCEPTANCE_IOS_TOKEN }}
          PIA_PUSH_ACCEPTANCE_ANDROID_TOKEN: ${{ secrets.PIA_PUSH_ACCEPTANCE_ANDROID_TOKEN }}
        shell: pwsh
        run: |
          python scripts/release_preflight.py > release-preflight.json
          exit $LASTEXITCODE

      - name: Upload release preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pia-release-preflight
          path: release-preflight.json
          if-no-files-found: error

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pia-windows-release
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/binaries/*.exe
            .pia/release/manifest.json
          if-no-files-found: error
